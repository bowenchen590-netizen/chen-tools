<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chen daily 物流 · {{DATE}}</title>
<style>
  :root {
    --bg: #f4f5f7;
    --card: #ffffff;
    --ink: #1a1d21;
    --ink-soft: #5b6570;
    --ink-faint: #8b95a1;
    --line: #e4e7eb;
    --accent: #0b6b5f;
    --accent-soft: #e3f1ef;
    --tag-bg: #eef1f4;
    --tag-ink: #45505c;
    --warn-bg: #fbede0;
    --warn-ink: #b4541c;
    --shadow: 0 1px 2px rgba(20,30,40,.06), 0 8px 24px rgba(20,30,40,.06);
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14171a;
      --card: #1e2226;
      --ink: #e9edf1;
      --ink-soft: #a9b3bd;
      --ink-faint: #7b8590;
      --line: #2c3237;
      --accent: #4bbfae;
      --accent-soft: #16302c;
      --tag-bg: #2a3036;
      --tag-ink: #b9c3cd;
      --warn-bg: #3a281c;
      --warn-ink: #e8a06d;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.28);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 880px; margin: 0 auto; padding: 40px 20px 64px; }

  header { margin-bottom: 28px; }
  .brand {
    font-size: 26px;
    font-weight: 700;
    letter-spacing: .3px;
    display: flex;
    align-items: baseline;
    gap: 12px;
    flex-wrap: wrap;
  }
  .brand .date { color: var(--accent); font-weight: 700; }
  .meta {
    margin-top: 8px;
    font-size: 13px;
    color: var(--ink-faint);
  }
  .note {
    margin-top: 14px;
    padding: 10px 14px;
    background: var(--accent-soft);
    border-radius: 10px;
    font-size: 14px;
    color: var(--ink-soft);
  }

  .cards { display: flex; flex-direction: column; gap: 14px; }

  .card {
    display: block;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 18px 20px;
    text-decoration: none;
    color: inherit;
    box-shadow: var(--shadow);
    transition: transform .12s ease, box-shadow .12s ease, border-color .12s ease;
  }
  .card:hover {
    transform: translateY(-2px);
    border-color: var(--accent);
    box-shadow: 0 2px 6px rgba(20,30,40,.10), 0 14px 32px rgba(20,30,40,.12);
  }
  .card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .card-top {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 12px;
    color: var(--ink-faint);
    margin-bottom: 8px;
    flex-wrap: wrap;
  }
  .source {
    font-weight: 600;
    color: var(--accent);
  }
  .dot { color: var(--line); }
  .paywall {
    background: var(--warn-bg);
    color: var(--warn-ink);
    border-radius: 999px;
    padding: 1px 8px;
    font-weight: 600;
  }

  .headline-cn {
    font-size: 17px;
    font-weight: 700;
    line-height: 1.45;
    margin: 0 0 3px;
  }
  .headline-orig {
    font-size: 12.5px;
    color: var(--ink-faint);
    margin: 0 0 10px;
  }
  .summary {
    font-size: 14.5px;
    color: var(--ink-soft);
    margin: 0 0 12px;
  }

  .tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .tag {
    font-size: 12px;
    background: var(--tag-bg);
    color: var(--tag-ink);
    border-radius: 999px;
    padding: 2px 10px;
  }
  .read {
    margin-top: 12px;
    font-size: 12.5px;
    color: var(--accent);
    font-weight: 600;
  }

  footer {
    margin-top: 40px;
    text-align: center;
    font-size: 12px;
    color: var(--ink-faint);
  }

  .empty {
    background: var(--card);
    border: 1px dashed var(--line);
    border-radius: var(--radius);
    padding: 40px 20px;
    text-align: center;
    color: var(--ink-faint);
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><span>Chen daily 物流</span><span class="date">· {{DATE}}</span></div>
    <div class="meta">共 {{COUNT}} 条精选 · 生成于 {{GENERATED_AT}}</div>
    {{NOTE_BLOCK}}
  </header>

  <main class="cards">
    {{CARDS}}
  </main>

  <footer>Chen daily 物流 — 每日物流行业资讯精选</footer>
</div>
</body>
</html>
